<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - คลังจัดการงานเดอะโมดิช</title>
    <style>
        :root {
            --primary: #1e40af;
            --bg: #f1f5f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
        }
        .admin-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 100%;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #0f172a; margin-top: 0; font-size: 20px; }
        
        .top-actions {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; background: #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 15px;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
        .toolbar select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; }

        /* ตารางสไตล์จอคอมพิวเตอร์ */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; vertical-align: middle; }
        th { background-color: #0f172a; color: white; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .admin-select { padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: bold; width: 100%; }
        .admin-note-input { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn-save-row { padding: 8px; background-color: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }

        .pagination-zone { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; font-size: 13px; font-weight: bold; }
        .btn-page { padding: 6px 12px; background-color: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-page:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        /* ครอบล็อกอิน */
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 300px; }
        .login-box input { padding: 10px; width: 100%; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; box-sizing: border-box; }
        .login-box button { padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

        /* 🌟 ระบบแจ้งเตือนหลังเซฟงานเสร็จในหน้าแอดมิน (สไลด์นุ่มๆ ไร้ URL) */
        .admin-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #22c55e; color: white; padding: 12px 24px; border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 99999;
            font-weight: bold; font-size: 14px; transition: top 0.4s ease;
        }
        .admin-toast.show { top: 20px; }

        /* 📱 📱 📱 คำสั่งแปลงโฉมหน้าตารางธรรมดา เป็นกล่องการ์ดเมื่อเปิดบนมือถือ 📱 📱 📱 */
        @media screen and (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { justify-content: space-between; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { background: white; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 15px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
            td { border: none; position: relative; padding-left: 40%; text-align: right; margin-bottom: 8px; min-height: 28px; }
            td:before { position: absolute; top: 10px; left: 10px; width: 35%; text-align: left; font-weight: bold; color: #64748b; }
            
            td:nth-of-type(1):before { content: "📅 วันที่:"; }
            td:nth-of-type(2):before { content: "🏠 บ้านเลขที่:"; }
            td:nth-of-type(3):before { content: "👤 ชื่อผู้แจ้ง:"; }
            td:nth-of-type(4):before { content: "📞 เบอร์โทร:"; }
            td:nth-of-type(5):before { content: "📁 หมวดหมู่:"; }
            td:nth-of-type(6):before { content: "📌 ปัญหา:"; }
            td:nth-of-type(7):before { content: "🔍 รายละเอียด:"; }
            td:nth-of-type(8):before { content: "🏘️ คู่กรณี:"; }
            td:nth-of-type(9):before { content: "⚙️ ปรับสถานะ:"; }
            td:nth-of-type(10):before { content: "📝 หมายเหตุ:"; }
            td:nth-of-type(11):before { content: "💾 จัดการ:"; }
        }
    </style>
</head>
<body>

<div id="adminToast" class="admin-toast">🎉 ดำเนินการเรียบร้อยแล้ว!</div>

<div id="loginOverlay">
    <div class="login-box">
        <h3 style="margin-top:0;">🔒 แผงควบคุมเจ้าหน้าที่</h3>
        <input type="text" id="adminUser" placeholder="ชื่อผู้ใช้งาน">
        <input type="password" id="adminPass" placeholder="รหัสผ่าน">
        <button onclick="checkLogin()">เข้าสู่ระบบ</button>
    </div>
</div>

<div class="admin-container" id="mainContent" style="display: none;">
    <h2>📊 รายการปัญหาทั้งหมด</h2>
    
    <div class="top-actions">
        <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: bold; font-size: 14px;">⬅️ หน้าหลัก</a>
        <button onclick="loadAdminData()" style="padding: 6px 12px; background:#10b981; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">🔄 รีเฟรช</button>
    </div>

    <div class="toolbar">
        <div class="filter-group">
            <label>📁 หมวดหมู่:</label>
            <select id="filterCategory" onchange="changeFilter()">
                <option value="all">ทั้งหมด</option>
                <option value="ปัญหาบ้าน">ปัญหาบ้าน</option>
                <option value="ปัญหาส่วนกลาง">ปัญหาส่วนกลาง</option>
                <option value="ร้องเรียนเพื่อนบ้าน">ร้องเรียนเพื่อนบ้าน</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🔄 วันที่:</label>
            <select id="sortOrder" onchange="changeFilter()">
                <option value="newest">ล่าสุดก่อน</option>
                <option value="oldest">เก่าสุดก่อน</option>
            </select>
        </div>
        <div class="filter-group" style="margin-left: auto;">
            <label>📄 หน้าละ:</label>
            <select id="rowsPerPage" onchange="changeFilter()">
                <option value="10">10 แถว</option>
                <option value="30">30 แถว</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>วันที่แจ้ง</th>
                    <th>บ้านเลขที่</th>
                    <th>ชื่อผู้แจ้ง</th>
                    <th>เบอร์โทร</th>
                    <th>หัวข้อปัญหา</th>
                    <th>ปัญหาที่พบ</th>
                    <th>รายละเอียดเพิ่มเติม</th>
                    <th>บ้านคู่กรณี</th>
                    <th style="min-width: 140px;">ปรับสถานะ</th>
                    <th>ข้อความหมายเหตุ</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="11" style="text-align: center; color: #64748b;">กำลังโหลดข้อมูลจากฐานข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-zone">
        <button id="btnPrev" class="btn-page" onclick="prevPage()">⬅️</button>
        <span id="pageInfo">หน้า 1 จาก 1</span>
        <button id="btnNext" class="btn-page" onclick="nextPage()">➡️</button>
    </div>
</div>

<script>
    const SECRET_USER = "admin"; const SECRET_PASSWORD = "1234";  
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNMDCh-SilFr9avDYLzKbfk2OIXgYJCYKeJ9bd2nEZfcr5xvPVuaBVFlOQ87xn05kA/exec";

    let allData = []; let currentPage = 1;

    function checkLogin() {
        const u = document.getElementById('adminUser').value.trim();
        const p = document.getElementById('adminPass').value;
        if (u === SECRET_USER && p === SECRET_PASSWORD) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadAdminData();
        } else { alert('❌ ลงชื่อเข้าใช้ไม่สำเร็จ!'); }
    }

    function loadAdminData() {
        fetch(`${WEB_APP_URL}?mode=adminAll`)
        .then(res => res.json())
        .then(data => { allData = data || []; renderTable(); });
    }

    function renderTable() {
        const tbody = document.getElementById('adminTableBody');
        const cat = document.getElementById('filterCategory').value;
        const sort = document.getElementById('sortOrder').value;
        const limit = parseInt(document.getElementById('rowsPerPage').value);
        tbody.innerHTML = '';

        let filtered = allData.filter(i => cat === "all" || i.category === cat);
        if (sort === "newest") filtered.reverse();

        const totalPages = Math.ceil(filtered.length / limit) || 1;
        const start = (currentPage - 1) * limit;
        const pageData = filtered.slice(start, start + limit);

        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" style="text-align: center;">📭 ไม่พบประวัติรายการ</td></tr>';
            return;
        }

        pageData.forEach((item, index) => {
            let bg = "#f1f5f9";
            if(item.status === "รับเรื่อง") bg = "#dbeafe";
            if(item.status === "กำลังดำเนินการ") bg = "#fef3c7";
            if(item.status === "เรียบร้อย") bg = "#d1e7dd";
            if(item.status === "ไม่สามารถแก้ไขได้") bg = "#fee2e2";

            tbody.innerHTML += `
                <tr>
                    <td>${item.date}</td>
                    <td><b>${item.houseNumber}</b></td>
                    <td>${item.name}</td>
                    <td><a href="tel:${item.phone}">${item.phone}</a></td>
                    <td><span style="background:#fef08a; padding:2px 6px; border-radius:4px;">${item.category}</span></td>
                    <td>${item.issue}</td>
                    <td>${item.details}</td>
                    <td style="color:#b45309;">${item.targetHouse}</td>
                    <td>
                        <select id="status_${index}" class="admin-select" style="background:${bg};" onchange="this.style.backgroundColor=this.options[this.selectedIndex].style.backgroundColor">
                            <option value="" ${item.status === "" ? "selected" : ""}>รอรับเรื่อง</option>
                            <option value="รับเรื่อง" style="background:#dbeafe;" ${item.status === "รับเรื่อง" ? "selected" : ""}>รับเรื่อง</option>
                            <option value="กำลังดำเนินการ" style="background:#fef3c7;" ${item.status === "กำลังดำเนินการ" ? "selected" : ""}>กำลังดำเนินการ</option>
                            <option value="เรียบร้อย" style="background:#d1e7dd;" ${item.status === "เรียบร้อย" ? "selected" : ""}>เรียบร้อย</option>
                            <option value="ไม่สามารถแก้ไขได้" style="background:#fee2e2;" ${item.status === "ไม่สามารถแก้ไขได้" ? "selected" : ""}>ไม่สามารถแก้ไขได้</option>
                        </select>
                    </td>
                    <td><input type="text" id="note_${index}" class="admin-note-input" value="${item.note || ''}"></td>
                    <td><button class="btn-save-row" id="btn_${index}" onclick="updateRowData('${item.dateId}', ${index})">บันทึก</button></td>
                </tr>
            `;
        });
        document.getElementById('pageInfo').innerText = `หน้า ${currentPage} จาก ${totalPages}`;
        document.getElementById('btnPrev').disabled = (currentPage === 1);
        document.getElementById('btnNext').disabled = (currentPage === totalPages);
    }

    function updateRowData(dateId, index) {
        const btn = document.getElementById(`btn_${index}`);
        btn.disabled = true; btn.innerText = "รอ...";

        const sendData = {
            action: "updateStatus", dateId: dateId,
            status: document.getElementById(`status_${index}`).value,
            note: document.getElementById(`note_${index}`).value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(sendData)
        })
        .then(() => { showAdminToast(); })
        .catch(() => { showAdminToast(); });
    }

    function showAdminToast() {
        const t = document.getElementById('adminToast');
        t.classList.add('show');
        setTimeout(() => { t.classList.remove('show'); loadAdminData(); }, 2000);
    }

    function changeFilter() { currentPage = 1; renderTable(); }
    function prevPage() { if(currentPage > 1) { currentPage--; renderTable(); } }
    function nextPage() { currentPage++; renderTable(); }

    // ดึงข้อมูลใหม่อัตโนมัติทุก 15 วินาที
    //setInterval(() => { if(document.getElementById('mainContent').style.display === 'block') loadAdminData(); }, 15000);
</script>
</body>
</html>
