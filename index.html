<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบแจ้งปัญหาโครงการเดอะโมดิช</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --bg: #f8fafc;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px; /* ปรับเป็น 16px เพื่อไม่ให้ iOS ซูมหน้าจออัตโนมัติเวลาโฟกัส */
            box-sizing: border-box;
            transition: all 0.2s;
            background-color: #fff;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }
        textarea { resize: vertical; height: 90px; }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        
        .divider {
            margin: 25px 0 20px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .btn-navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-link {
            text-align: center;
            text-decoration: none;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-link:hover { opacity: 0.9; }
        .btn-track { background-color: var(--success); }
        .btn-admin { background-color: #334155; }

        /* กล่องค้นหาจำลองสำหรับช่องตัวเลือกบนมือถือ */
        .search-select-container {
            position: relative;
        }
        .search-input-box {
            margin-bottom: 4px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%2394a3b8" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
            background-repeat: no-repeat;
            background-position: 12px center;
            padding-left: 36px;
        }

        .toast-box {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            z-index: 99999;
            width: 85%;
            max-width: 400px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            border-left: 5px solid var(--success);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-box.show { top: 20px; }
    </style>
</head>
<body>

<div id="toastAlert" class="toast-box">🎉 บันทึกข้อมูลการแจ้งปัญหาเรียบร้อย!</div>

<div class="form-container">
    <h2>📝 แจ้งปัญหาออนไลน์</h2>
    
    <form id="issueForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="category">📁 หัวข้อปัญหา:</label>
            <select id="category" onchange="toggleTargetHouse()" required>
                <option value="" disabled selected>-- เลือกหัวข้อปัญหา --</option>
                <option value="ปัญหาบ้าน">ปัญหาบ้าน</option>
                <option value="ปัญหาส่วนกลาง">ปัญหาส่วนกลาง</option>
                <option value="ร้องเรียนเพื่อนบ้าน">ร้องเรียนเพื่อนบ้าน</option>
            </select>
        </div>

        <div class="form-group" id="targetHouseGroup" style="display: none;">
            <label>🏘️ ระบุบ้านเลขที่คู่กรณี (1-405):</label>
            <div class="search-select-container">
                <input type="text" class="search-input-box" id="searchTargetHouse" placeholder="พิมพ์เลขเพื่อค้นหาคู่กรณี..." oninput="filterHouses('searchTargetHouse', 'targetHouse')">
                <select id="targetHouse" size="5">
                    </select>
            </div>
        </div>

        <div class="form-group">
            <label>🏠 บ้านเลขที่ของคุณ (1-405):</label>
            <div class="search-select-container">
                <input type="text" class="search-input-box" id="searchHouseNumber" placeholder="พิมพ์เลขเพื่อค้นหาบ้านเลขที่..." oninput="filterHouses('searchHouseNumber', 'houseNumber')">
                <select id="houseNumber" size="5" required>
                    </select>
            </div>
        </div>

        <div class="form-group">
            <label for="alley">📍 ซอยที่อยู่:</label>
            <select id="alley" required>
                <option value="" disabled selected>-- เลือกซอย --</option>
                <option value="ซอย 1">ซอย 1</option>
                <option value="ซอย 2">ซอย 2</option>
                <option value="ซอย 3">ซอย 3</option>
                <option value="ซอย 4">ซอย 4</option>
                <option value="ซอย 5">ซอย 5</option>
                <option value="ซอย 6">ซอย 6</option>
                <option value="ซอย 7">ซอย 7</option>
                <option value="ซอย 8">ซอย 8</option>
                <option value="ซอย 9">ซอย 9</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">👤 ชื่อผู้แจ้ง:</label>
            <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
            <label for="phone">📞 เบอร์โทรศัพท์ติดต่อ:</label>
            <input type="tel" id="phone" placeholder="ตัวอย่าง: 08XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="issue">📌 ปัญหาที่พบ:</label>
            <input type="text" id="issue" placeholder="เช่น ท่อแตก, ไฟดับ, เสียงดัง" required>
        </div>

        <div class="form-group">
            <label for="details">🔍 รายละเอียดเพิ่มเติม:</label>
            <textarea id="details" placeholder="ระบุรายละเอียดคร่าวๆ..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งข้อมูลแจ้งปัญหา</button>
    </form>

    <hr class="divider">

    <div class="btn-navigation">
        <a href="track.html" class="btn-link btn-track">🔍 เช็กสถานะ</a>
        <a href="admin.html" class="btn-link btn-admin">🔐 เจ้าหน้าที่</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNMDCh-SilFr9avDYLzKbfk2OIXgYJCYKeJ9bd2nEZfcr5xvPVuaBVFlOQ87xn05kA/exec";
    
    // เก็บรายการบ้านทั้งหมดไว้ในตัวแปรหลัก
    const allHouses = [];
    for (let i = 1; i <= 405; i++) { allHouses.push(i.toString()); }

    // 🔄 ฟังก์ชันสร้างตัวเลือกใส่ในตารางเริ่มต้น
    window.onload = function() {
        renderDropdown('houseNumber', allHouses);
        renderDropdown('targetHouse', allHouses);
    };

    function renderDropdown(selectId, list) {
        const selectEl = document.getElementById(selectId);
        let options = selectId === 'houseNumber' ? '<option value="" disabled selected>-- เลือกบ้านเลขที่ --</option>' : '<option value="" disabled selected>-- เลือกคู่กรณี --</option>';
        list.forEach(num => {
            options += `<option value="${num}">บ้านเลขที่ ${num}</option>`;
        });
        selectEl.innerHTML = options;
    }

    // 🔍 ระบบกรองพิมพ์ค้นหาแบบเรียลไทม์ รองรับมือถือเต็มรูปแบบ
    function filterHouses(inputId, selectId) {
        const query = document.getElementById(inputId).value.trim();
        if (query === "") {
            renderDropdown(selectId, allHouses);
        } else {
            const filtered = allHouses.filter(num => num.includes(query));
            renderDropdown(selectId, filtered);
            // แสดงลิสต์ที่กรองแล้ว
            document.getElementById(selectId).size = Math.min(filtered.length + 1, 5); 
        }
    }

    function toggleTargetHouse() {
        const category = document.getElementById('category').value;
        const targetHouseGroup = document.getElementById('targetHouseGroup');
        const targetHouseSelect = document.getElementById('targetHouse');

        if (category === 'ร้องเรียนเพื่อนบ้าน') {
            targetHouseGroup.style.display = 'block';
            targetHouseSelect.required = true;
            targetHouseSelect.value = ''; 
        } else {
            targetHouseGroup.style.display = 'none';
            targetHouseSelect.required = false;
            // สร้าง option ชั่วคราวเพื่อส่งค่า
            targetHouseSelect.innerHTML = '<option value="ไม่มี (หัวข้ออื่น)" selected>ไม่มี (หัวข้ออื่น)</option>';
        }
    }

    function triggerToast(msg) {
        const toast = document.getElementById('toastAlert');
        toast.innerText = msg;
        toast.classList.add('show');
        
        document.getElementById('issueForm').reset(); 
        document.getElementById('searchHouseNumber').value = '';
        document.getElementById('searchTargetHouse').value = '';
        renderDropdown('houseNumber', allHouses);
        renderDropdown('targetHouse', allHouses);
        toggleTargetHouse();

        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    function submitForm(event) {
        event.preventDefault();
        
        const houseValue = document.getElementById('houseNumber').value;
        if (!houseValue) {
            alert('❌ กรุณาคลิกเลือกตัวเลือกบ้านเลขที่ของคุณในตารางด้านล่างกล่องค้นหาด้วยครับ');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล...";

        const formData = {
            houseNumber: houseValue,
            alley: document.getElementById('alley').value,
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            category: document.getElementById('category').value,
            targetHouse: document.getElementById('targetHouse').value,
            issue: document.getElementById('issue').value.trim(),
            details: document.getElementById('details').value.trim()
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(formData)
        })
        .then(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .catch(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูลแจ้งปัญหา";
        });
    }
</script>
</body>
</html>
