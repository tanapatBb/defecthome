<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งปัญหาโครงการเดอะโมดิช</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --bg: #f8fafc;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s;
            background-color: #fff;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }
        textarea { resize: vertical; height: 90px; }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        
        .divider {
            margin: 25px 0 20px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .btn-navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-link {
            text-align: center;
            text-decoration: none;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-link:hover { opacity: 0.9; }
        .btn-track { background-color: var(--success); }
        .btn-admin { background-color: #334155; }

        .toast-box {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            z-index: 99999;
            width: 85%;
            max-width: 400px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            border-left: 5px solid var(--success);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-box.show { top: 20px; }
    </style>
</head>
<body>

<div id="toastAlert" class="toast-box">🎉 บันทึกข้อมูลการแจ้งปัญหาเรียบร้อย!</div>

<div class="form-container">
    <h2>📝 แจ้งปัญหาออนไลน์</h2>
    
    <form id="issueForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="category">📁 หัวข้อปัญหา:</label>
            <select id="category" onchange="toggleTargetHouse()" required>
                <option value="" disabled selected>-- เลือกหัวข้อปัญหา --</option>
                <option value="ปัญหาบ้าน">ปัญหาบ้าน</option>
                <option value="ปัญหาส่วนกลาง">ปัญหาส่วนกลาง</option>
                <option value="ร้องเรียนเพื่อนบ้าน">ร้องเรียนเพื่อนบ้าน</option>
            </select>
        </div>

        <div class="form-group" id="targetHouseGroup" style="display: none;">
            <label for="targetHouse">🏘️ ระบุบ้านเลขที่คู่กรณี (พิมพ์ค้นหาหรือเลื่อนเลือกเลข 1-405):</label>
            <input type="text" id="targetHouse" list="houseNumbersList" placeholder="พิมพ์ค้นหา หรือคลิกเลือก...">
        </div>

        <div class="form-group">
            <label for="houseNumber">🏠 บ้านเลขที่ของคุณ (พิมพ์ค้นหาหรือเลื่อนเลือกเลข 1-405):</label>
            <input type="text" id="houseNumber" list="houseNumbersList" placeholder="พิมพ์ค้นหา หรือคลิกเลือก..." required>
        </div>

        <datalist id="houseNumbersList"></datalist>

        <div class="form-group">
            <label for="alley">📍 ซอยที่อยู่:</label>
            <select id="alley" required>
                <option value="" disabled selected>-- เลือกซอย --</option>
                <option value="ซอย 1">ซอย 1</option>
                <option value="ซอย 2">ซอย 2</option>
                <option value="ซอย 3">ซอย 3</option>
                <option value="ซอย 4">ซอย 4</option>
                <option value="ซอย 5">ซอย 5</option>
                <option value="ซอย 6">ซอย 6</option>
                <option value="ซอย 7">ซอย 7</option>
                <option value="ซอย 8">ซอย 8</option>
                <option value="ซอย 9">ซอย 9</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">👤 ชื่อผู้แจ้ง:</label>
            <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
            <label for="phone">📞 เบอร์โทรศัพท์ติดต่อ:</label>
            <input type="tel" id="phone" placeholder="ตัวอย่าง: 08XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="issue">📌 ปัญหาที่พบ:</label>
            <input type="text" id="issue" placeholder="เช่น ท่อแตก, ไฟดับ, เสียงดัง" required>
        </div>

        <div class="form-group">
            <label for="details">🔍 รายละเอียดเพิ่มเติม:</label>
            <textarea id="details" placeholder="ระบุรายละเอียดคร่าวๆ..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งข้อมูลแจ้งปัญหา</button>
    </form>

    <hr class="divider">

    <div class="btn-navigation">
        <a href="track.html" class="btn-link btn-track">🔍 เช็กสถานะ</a>
        <a href="admin.html" class="btn-link btn-admin">🔐 เจ้าหน้าที่</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNMDCh-SilFr9avDYLzKbfk2OIXgYJCYKeJ9bd2nEZfcr5xvPVuaBVFlOQ87xn05kA/exec";

    // 🔄 ฟังก์ชันสร้างเลข 1-405 ใส่ใน Dropdown อัตโนมัติเมื่อเปิดหน้าเว็บ
    window.onload = function() {
        const datalist = document.getElementById('houseNumbersList');
        let options = '';
        for (let i = 1; i <= 405; i++) {
            options += `<option value="${i}"></option>`;
        }
        datalist.innerHTML = options;
    };

    function toggleTargetHouse() {
        const category = document.getElementById('category').value;
        const targetHouseGroup = document.getElementById('targetHouseGroup');
        const targetHouseInput = document.getElementById('targetHouse');

        if (category === 'ร้องเรียนเพื่อนบ้าน') {
            targetHouseGroup.style.display = 'block';
            targetHouseInput.required = true;
            targetHouseInput.value = ''; 
        } else {
            targetHouseGroup.style.display = 'none';
            targetHouseInput.required = false;
            targetHouseInput.value = 'ไม่มี (หัวข้ออื่น)'; 
        }
    }

    function triggerToast(msg) {
        const toast = document.getElementById('toastAlert');
        toast.innerText = msg;
        toast.classList.add('show');
        
        document.getElementById('issueForm').reset(); 
        toggleTargetHouse();

        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    function submitForm(event) {
        event.preventDefault();
        
        // ตรวจสอบความถูกต้องของตัวเลข (ต้องอยู่ระหว่าง 1-405)
        const hNum = parseInt(document.getElementById('houseNumber').value);
        if (isNaN(hNum) || hNum < 1 || hNum > 405) {
            alert('❌ กรุณาระบุบ้านเลขที่ให้ถูกต้อง (ระหว่างเลข 1 ถึง 405 เท่านั้น)');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล...";

        const formData = {
            houseNumber: document.getElementById('houseNumber').value.trim(),
            alley: document.getElementById('alley').value,
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            category: document.getElementById('category').value,
            targetHouse: document.getElementById('targetHouse').value.trim(),
            issue: document.getElementById('issue').value.trim(),
            details: document.getElementById('details').value.trim()
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(formData)
        })
        .then(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .catch(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูลแจ้งปัญหา";
        });
    }
</script>
</body>
</html>
