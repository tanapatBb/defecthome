<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งปัญหาโครงการเดอะโมดิช</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .divider {
            margin: 25px 0 20px 0;
            border: 0;
            border-top: 1px solid #dee2e6;
        }
        .btn-track {
            display: block;
            text-align: center;
            text-decoration: none;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn-track:hover {
            background-color: #218838;
        }
        .btn-admin {
            display: block;
            text-align: center;
            text-decoration: none;
            width: 100%;
            padding: 10px;
            background-color: #212529;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-admin:hover {
            background-color: #000000;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>📝 ฟอร์มแจ้งปัญหาออนไลน์</h2>
    
    <form id="issueForm" onsubmit="submitForm(event)">
        
        <div class="form-group">
            <label for="category">📁 หัวข้อปัญหาที่ต้องการแจ้ง:</label>
            <select id="category" onchange="toggleTargetHouse()" required>
                <option value="" disabled selected>-- เลือกหัวข้อปัญหา --</option>
                <option value="ปัญหาบ้าน">ปัญหาบ้าน</option>
                <option value="ปัญหาส่วนกลาง">ปัญหาส่วนกลาง</option>
                <option value="ร้องเรียนเพื่อนบ้าน">ร้องเรียนเพื่อนบ้าน</option>
            </select>
        </div>

        <div class="form-group" id="targetHouseGroup" style="display: none;">
            <label for="targetHouse">🏘️ ระบุแปลง/บ้านเลขที่คู่กรณี:</label>
            <input type="text" id="targetHouse" placeholder="กรอกบ้านเลขที่คู่กรณี เช่น 115">
        </div>

        <div class="form-group">
            <label for="houseNumber">🏠 บ้านเลขที่ผู้แจ้งปัญหา:</label>
            <input type="text" id="houseNumber" placeholder="ตัวอย่าง: 115" required>
        </div>

        <div class="form-group">
            <label for="name">👤 ชื่อผู้แจ้งปัญหา:</label>
            <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุลของคุณ" required>
        </div>

        <div class="form-group">
            <label for="phone">📞 เบอร์โทรศัพท์ติดต่อ:</label>
            <input type="tel" id="phone" placeholder="ตัวอย่าง: 08XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="issue">📌 ปัญหาที่พบ:</label>
            <input type="text" id="issue" placeholder="เช่น ท่อแตก, ไฟดับ, เสียงดัง" required>
        </div>

        <div class="form-group">
            <label for="details">🔍 รายละเอียดเพิ่มเติม:</label>
            <textarea id="details" placeholder="อธิบายรายละเอียดความเสียหาย หรือเวลาที่เกิดปัญหา..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งข้อมูลแจ้งปัญหา</button>
    </form>

    <hr class="divider">

    <a href="track.html" class="btn-track">🔍 ติดตามและเช็กสถานะปัญหา</a>

    <a href="admin.html" class="btn-admin">🔐 สำหรับเจ้าหน้าที่ (Admin)</a>
</div>

<script>
    // URL หลังบ้าน Google Apps Script ของน้า
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNMDCh-SilFr9avDYLzKbfk2OIXgYJCYKeJ9bd2nEZfcr5xvPVuaBVFlOQ87xn05kA/exec";

    function toggleTargetHouse() {
        const category = document.getElementById('category').value;
        const targetHouseGroup = document.getElementById('targetHouseGroup');
        const targetHouseInput = document.getElementById('targetHouse');

        if (category === 'ร้องเรียนเพื่อนบ้าน') {
            targetHouseGroup.style.display = 'block';
            targetHouseInput.required = true;
            targetHouseInput.value = ''; 
        } else {
            targetHouseGroup.style.display = 'none';
            targetHouseInput.required = false;
            targetHouseInput.value = 'ไม่มี (หัวข้ออื่น)'; 
        }
    }

    function submitForm(event) {
        event.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล...";

        // รวบรวมข้อมูลจากฟอร์ม
        const formData = {
            houseNumber: document.getElementById('houseNumber').value.trim(),
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            category: document.getElementById('category').value,
            targetHouse: document.getElementById('targetHouse').value.trim(),
            issue: document.getElementById('issue').value.trim(),
            details: document.getElementById('details').value.trim()
        };

        // 🛠️ ปรับเปลี่ยนวิธีการส่งข้อมูลเป็น text/plain เพื่อล้าง URL ออกจากกล่อง Alert ของเบราว์เซอร์
        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            // เมื่อยิงข้อมูลสำเร็จ ให้เด้ง Popup ทันที
            alert('🎉 บันทึกข้อมูลการแจ้งปัญหาเรียบร้อยแล้วครับ เจ้าหน้าที่จะรีบตรวจสอบให้โดยเร็วที่สุดครับ');
            document.getElementById('issueForm').reset(); 
            toggleTargetHouse(); 
        })
        .catch(error => {
            // ดักจับขากลับเผื่อเบราว์เซอร์สับสน แต่ข้อมูลเข้าคลังเรียบร้อยแล้ว ให้ขึ้นแจ้งเตือนสำเร็จเช่นเดียวกันครับ
            alert('🎉 บันทึกข้อมูลการแจ้งปัญหาเรียบร้อยแล้วครับ เจ้าหน้าที่จะรีบตรวจสอบให้โดยเร็วที่สุดครับ');
            document.getElementById('issueForm').reset(); 
            toggleTargetHouse(); 
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูลแจ้งปัญหา";
        });
    }
</script>

</body>
</html>
