<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งปัญหาโครงการเดอะโมดิช</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --bg: #f8fafc;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s;
            background-color: #fff;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }
        textarea { resize: vertical; height: 90px; }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        
        .divider {
            margin: 25px 0 20px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .btn-navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-link {
            text-align: center;
            text-decoration: none;
            padding: 12px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-link:hover { opacity: 0.9; }
        .btn-track { background-color: var(--success); }
        .btn-admin { background-color: #334155; }

        /* 👑 ชุดสไตล์พิเศษสำหรับ Super Search Dropdown */
        .super-dropdown-btn {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23475569" class="bi bi-chevron-down" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/></svg>');
            background-repeat: no-repeat;
            background-position: calc(100% - 14px) center;
            background-size: 14px;
            cursor: pointer;
            text-align: left;
            user-select: none;
        }
        .super-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 6px;
        }
        .super-dropdown-menu.open {
            display: block;
        }
        .super-search-input {
            padding: 10px 10px 10px 32px;
            font-size: 15px;
            margin-bottom: 6px;
            border-radius: 6px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="%2394a3b8" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
            background-repeat: no-repeat;
            background-position: 10px center;
        }
        .super-options-list {
            max-height: 180px;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .super-option-item {
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            color: var(--text);
        }
        .super-option-item:hover {
            background-color: #f1f5f9;
            color: var(--primary);
            font-weight: 600;
        }
        .super-option-item.no-result {
            color: #94a3b8;
            text-align: center;
            cursor: default;
        }
        .super-option-item.no-result:hover { background: none; color: #94a3b8; font-weight: normal; }

        .toast-box {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            z-index: 99999;
            width: 85%;
            max-width: 400px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            border-left: 5px solid var(--success);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-box.show { top: 20px; }
    </style>
</head>
<body>

<div id="toastAlert" class="toast-box">🎉 บันทึกข้อมูลการแจ้งปัญหาเรียบร้อย!</div>

<div class="form-container">
    <h2>📝 แจ้งปัญหาออนไลน์</h2>
    
    <form id="issueForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="category">📁 หัวข้อปัญหา:</label>
            <select id="category" onchange="toggleTargetHouse()" required>
                <option value="" disabled selected>-- เลือกหัวข้อปัญหา --</option>
                <option value="ปัญหาบ้าน">ปัญหาบ้าน</option>
                <option value="ปัญหาส่วนกลาง">ปัญหาส่วนกลาง</option>
                <option value="ร้องเรียนเพื่อนบ้าน">ร้องเรียนเพื่อนบ้าน</option>
            </select>
        </div>

        <div class="form-group" id="targetHouseGroup" style="display: none;">
            <label>🏘️ ระบุบ้านเลขที่คู่กรณี:</label>
            <div id="btnTargetHouse" class="super-dropdown-btn" onclick="toggleMenu('menuTargetHouse')">-- เลือกคู่กรณี --</div>
            <input type="hidden" id="targetHouse" value="">
            
            <div id="menuTargetHouse" class="super-dropdown-menu">
                <input type="text" class="super-search-input" placeholder="พิมพ์เลขค้นหาคู่กรณี..." oninput="filterOptions('menuTargetHouse', this.value, 'targetHouse')">
                <ul class="super-options-list" id="listTargetHouse"></ul>
            </div>
        </div>

        <div class="form-group">
            <label>🏠 บ้านเลขที่ของคุณ:</label>
            <div id="btnHouseNumber" class="super-dropdown-btn" onclick="toggleMenu('menuHouseNumber')">-- เลือกบ้านเลขที่ --</div>
            <input type="hidden" id="houseNumber" value="" required>
            
            <div id="menuHouseNumber" class="super-dropdown-menu">
                <input type="text" class="super-search-input" placeholder="พิมพ์เลขค้นหาบ้านเลขที่..." oninput="filterOptions('menuHouseNumber', this.value, 'houseNumber')">
                <ul class="super-options-list" id="listHouseNumber"></ul>
            </div>
        </div>

        <div class="form-group">
            <label for="alley">📍 ซอยที่อยู่:</label>
            <select id="alley" required>
                <option value="" disabled selected>-- เลือกซอย --</option>
                <option value="ซอย 1">ซอย 1</option>
                <option value="ซอย 2">ซอย 2</option>
                <option value="ซอย 3">ซอย 3</option>
                <option value="ซอย 4">ซอย 4</option>
                <option value="ซอย 5">ซอย 5</option>
                <option value="ซอย 6">ซอย 6</option>
                <option value="ซอย 7">ซอย 7</option>
                <option value="ซอย 8">ซอย 8</option>
                <option value="ซอย 9">ซอย 9</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">👤 ชื่อผู้แจ้ง:</label>
            <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
            <label for="phone">📞 เบอร์โทรศัพท์ติดต่อ:</label>
            <input type="tel" id="phone" placeholder="ตัวอย่าง: 08XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="issue">📌 ปัญหาที่พบ:</label>
            <input type="text" id="issue" placeholder="เช่น ท่อแตก, ไฟดับ, เสียงดัง" required>
        </div>

        <div class="form-group">
            <label for="details">🔍 รายละเอียดเพิ่มเติม:</label>
            <textarea id="details" placeholder="ระบุรายละเอียดคร่าวๆ..."></textarea>
        </div>

        <button type="submit" id="submitBtn">ส่งข้อมูลแจ้งปัญหา</button>
    </form>

    <hr class="divider">

    <div class="btn-navigation">
        <a href="track.html" class="btn-link btn-track">🔍 เช็กสถานะ</a>
        <a href="admin.html" class="btn-link btn-admin">🔐 เจ้าหน้าที่</a>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNMDCh-SilFr9avDYLzKbfk2OIXgYJCYKeJ9bd2nEZfcr5xvPVuaBVFlOQ87xn05kA/exec";

    // 🔄 เริ่มต้นระบบสร้างตัวเลือกเลข 1-405 ล้วนๆ
    window.onload = function() {
        initSuperDropdown('listHouseNumber', 'houseNumber', 'menuHouseNumber', 'btnHouseNumber');
        initSuperDropdown('listTargetHouse', 'targetHouse', 'menuTargetHouse', 'btnTargetHouse');
    };

    function initSuperDropdown(listId, hiddenInputId, menuId, btnId) {
        const listEl = document.getElementById(listId);
        let items = '';
        for (let i = 1; i <= 405; i++) {
            items += `<li class="super-option-item" onclick="selectSuperValue('${i}', '${hiddenInputId}', '${menuId}', '${btnId}')">${i}</li>`;
        }
        listEl.innerHTML = items;
    }

    // เปิด-ปิด เมนู Dropdown
    function toggleMenu(menuId) {
        // ปิดเมนูอื่นๆ ก่อนเปิดเมนูที่เลือก
        document.querySelectorAll('.super-dropdown-menu').forEach(menu => {
            if(menu.id !== menuId) menu.classList.remove('open');
        });
        document.getElementById(menuId).classList.toggle('open');
    }

    // ฟังก์ชันเลือกค่าจากลิสต์
    function selectSuperValue(val, hiddenInputId, menuId, btnId) {
        document.getElementById(hiddenInputId).value = val;
        document.getElementById(btnId).innerText = val; // เปลี่ยนคำบนปุ่มเป็นตัวเลขล้วนๆ ที่เลือก
        document.getElementById(menuId).classList.remove('open');
        // เคลียร์ช่องค้นหาให้กลับมาโชว์ 1-405 เหมือนเดิมรอบหน้า
        const menu = document.getElementById(menuId);
        menu.querySelector('.super-search-input').value = '';
        filterOptions(menuId, '', hiddenInputId);
    }

    // 🔍 ฟังก์ชัน Super Search คัดกรองตัวเลขเรียลไทม์
    function filterOptions(menuId, keyword, hiddenInputId) {
        const menu = document.getElementById(menuId);
        const items = menu.querySelectorAll('.super-option-item');
        let hasResult = false;

        // ลบคอมเมนต์แจ้งว่าไม่พบข้อมูลเก่าออกก่อน
        const oldNoResult = menu.querySelector('.no-result');
        if(oldNoResult) oldNoResult.remove();

        items.forEach(item => {
            if (item.innerText.includes(keyword.trim())) {
                item.style.display = 'block';
                hasResult = true;
            } else {
                item.style.display = 'none';
            }
        });

        // ถ้าพิมพ์เลขมั่วแล้วไม่เจอ ให้ขึ้นเตือน
        if (!hasResult) {
            const list = menu.querySelector('.super-options-list');
            const noResultLi = document.createElement('li');
            noResultLi.className = 'super-option-item no-result';
            noResultLi.innerText = '❌ ไม่พบเลขคู่นี้ (1-405)';
            list.appendChild(noResultLi);
        }
    }

    // คลิกนอกพื้นที่กล่องให้ปิดเมนูอัตโนมัติ
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.form-group')) {
            document.querySelectorAll('.super-dropdown-menu').forEach(menu => menu.classList.remove('open'));
        }
    });

    function toggleTargetHouse() {
        const category = document.getElementById('category').value;
        const targetHouseGroup = document.getElementById('targetHouseGroup');
        const targetHouseInput = document.getElementById('targetHouse');
        const btnTargetHouse = document.getElementById('btnTargetHouse');

        if (category === 'ร้องเรียนเพื่อนบ้าน') {
            targetHouseGroup.style.display = 'block';
            targetHouseInput.value = ''; 
            btnTargetHouse.innerText = '-- เลือกคู่กรณี --';
        } else {
            targetHouseGroup.style.display = 'none';
            targetHouseInput.value = 'ไม่มี (หัวข้ออื่น)'; 
        }
    }

    function triggerToast(msg) {
        const toast = document.getElementById('toastAlert');
        toast.innerText = msg;
        toast.classList.add('show');
        
        document.getElementById('issueForm').reset(); 
        document.getElementById('houseNumber').value = '';
        document.getElementById('btnHouseNumber').innerText = '-- เลือกบ้านเลขที่ --';
        toggleTargetHouse();

        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    function submitForm(event) {
        event.preventDefault();
        
        // บังคับว่าต้องเลือกบ้านเลขที่ก่อนส่ง
        if (!document.getElementById('houseNumber').value) {
            alert('❌ กรุณาคลิกเลือกบ้านเลขที่ของคุณด้วยครับ');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล...";

        const formData = {
            houseNumber: document.getElementById('houseNumber').value,
            alley: document.getElementById('alley').value,
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            category: document.getElementById('category').value,
            targetHouse: document.getElementById('targetHouse').value,
            issue: document.getElementById('issue').value.trim(),
            details: document.getElementById('details').value.trim()
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(formData)
        })
        .then(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .catch(() => { triggerToast('🎉 บันทึกข้อมูลเรียบร้อยแล้ว'); })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งข้อมูลแจ้งปัญหา";
        });
    }
</script>
</body>
</html>
